include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml

stages: [test, contract]

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

gateway:test:
  stage: test
  image: node:22
  services:
    - name: redis:7-alpine
      alias: redis
  variables:
    REDIS_URL: redis://redis:6379
  cache:
    key: gateway-npm
    paths: [.npm]
  script:
    - npm ci
    - npm run typecheck
    - npm test

# Contratos OpenAPI contra un entorno levantado. Se dispara cuando existe
# KUBO_API (por ejemplo, un entorno de staging); en local lo cubre `make ci`.
gateway:contracts:
  stage: contract
  image: node:22
  rules:
    - if: $KUBO_API
      when: manual
  script:
    - npm ci
    - node scripts/contracts.mjs
